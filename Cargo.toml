[workspace]
resolver = "2"
members = [
    "crates/llm-tracer",
]
default-members = [
    "crates/llm-tracer",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/wittkung/llm"

[workspace.dependencies]
anyhow = "1.0"
candle-core = "0.8"
candle-nn = "0.8"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

# Optimize third-party tensor libraries (candle, tokenizers) even in `cargo run` dev mode
[profile.dev.package."*"]
opt-level = 3
